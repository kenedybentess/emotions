<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pro - Cadastro e Movimentação</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --light: #f4f7f6;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light); display: flex; }
        .sidebar { width: 220px; height: 100vh; background: var(--primary); color: white; position: fixed; padding: 20px; }
        .main-content { margin-left: 260px; padding: 30px; width: 100%; }
        
        /* Botões */
        .header-actions { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 12px 18px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; transition: 0.2s; }
        .btn-new { background: var(--primary); }
        .btn-in { background: var(--success); }
        .btn-out { background: var(--danger); }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

        /* Tabelas */
        .grid { display: grid; grid-template-columns: 2fr 1.2fr; gap: 20px; }
        section { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #fafafa; color: #7f8c8d; font-size: 0.85rem; }

        /* Modais */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; width: 400px; margin: 10% auto; padding: 25px; border-radius: 12px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; color: white; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>E-PRO</h2>
        <p>Injeção Plástica</p>
    </aside>

    <main class="main-content">
        <h1>Painel de Controle de Estoque</h1>
        
        <div class="header-actions">
            <button class="btn btn-new" onclick="openModal('modalNovo')">📦 Cadastrar Produto</button>
            <button class="btn btn-in" onclick="openModal('modalEntrada')">➕ Entrada</button>
            <button class="btn btn-out" onclick="openModal('modalSaida')">➖ Saída</button>
        </div>

        <div class="grid">
            <section>
                <h3>Inventário Geral</h3>
                <table>
                    <thead>
                        <tr><th>Cód.</th><th>Descrição</th><th>Qtd.</th><th>Status</th></tr>
                    </thead>
                    <tbody id="listaProdutos"></tbody>
                </table>
            </section>

            <section>
                <h3>Movimentações Recentes</h3>
                <table style="font-size: 0.85rem;">
                    <tbody id="listaLogs"></tbody>
                </table>
            </section>
        </div>
    </main>

    <!-- MODAL 1: CADASTRAR PRODUTO -->
    <div id="modalNovo" class="modal">
        <div class="modal-content">
            <h3>Novo Produto</h3>
            <input type="text" id="new-code" placeholder="Código (Ex: #MOL-01)">
            <input type="text" id="new-desc" placeholder="Descrição (Ex: Resina PP)">
            <input type="number" id="new-min" placeholder="Estoque Mínimo">
            <button class="btn btn-new" style="width:100%" onclick="cadastrarProduto()">Salvar Produto</button>
            <button onclick="closeModal('modalNovo')" style="width:100%; background:none; border:none; margin-top:10px; cursor:pointer">Fechar</button>
        </div>
    </div>

    <!-- MODAL 2: ENTRADA -->
    <div id="modalEntrada" class="modal">
        <div class="modal-content">
            <h3>Registrar Entrada</h3>
            <select id="select-in"></select>
            <input type="number" id="qty-in" placeholder="Quantidade a somar">
            <button class="btn btn-in" style="width:100%" onclick="movimentar('IN')">Confirmar Entrada</button>
            <button onclick="closeModal('modalEntrada')" style="width:100%; background:none; border:none; margin-top:10px; cursor:pointer">Fechar</button>
        </div>
    </div>

    <!-- MODAL 3: SAÍDA -->
    <div id="modalSaida" class="modal">
        <div class="modal-content">
            <h3>Registrar Saída</h3>
            <select id="select-out"></select>
            <input type="number" id="qty-out" placeholder="Quantidade a retirar">
            <button class="btn btn-out" style="width:100%" onclick="movimentar('OUT')">Confirmar Saída</button>
            <button onclick="closeModal('modalSaida')" style="width:100%; background:none; border:none; margin-top:10px; cursor:pointer">Fechar</button>
        </div>
    </div>

    <script>
        // Banco de dados local (Substituir por Firebase para multiusuário)
        let produtos = JSON.parse(localStorage.getItem('inj_produtos')) || [];
        let logs = JSON.parse(localStorage.getItem('inj_logs')) || [];

        function openModal(id) {
            if (id !== 'modalNovo') preencherSelects();
            document.getElementById(id).style.display = 'block';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function cadastrarProduto() {
            const code = document.getElementById('new-code').value;
            const desc = document.getElementById('new-desc').value;
            const min = parseInt(document.getElementById('new-min').value);

            if (!code || !desc) return alert("Preencha os campos!");

            produtos.push({ code, desc, min, qty: 0 });
            salvar();
            closeModal('modalNovo');
        }

        function preencherSelects() {
            const sIn = document.getElementById('select-in');
            const sOut = document.getElementById('select-out');
            sIn.innerHTML = sOut.innerHTML = '<option value="">Selecione o produto...</option>';
            
            produtos.forEach((p, index) => {
                let opt = `<option value="${index}">${p.desc} (${p.code})</option>`;
                sIn.innerHTML += opt;
                sOut.innerHTML += opt;
            });
        }

        function movimentar(tipo) {
            const idx = document.getElementById(tipo === 'IN' ? 'select-in' : 'select-out').value;
            const qty = parseInt(document.getElementById(tipo === 'IN' ? 'qty-in' : 'qty-out').value);

            if (idx === "" || isNaN(qty)) return alert("Dados inválidos!");

            const p = produtos[idx];
            if (tipo === 'OUT' && p.qty < qty) return alert("Estoque insuficiente!");

            p.qty = tipo === 'IN' ? p.qty + qty : p.qty - qty;
            
            logs.unshift({
                data: new Date().toLocaleTimeString(),
                txt: `${tipo === 'IN' ? '➕' : '➖'} ${qty} un. de ${p.code}`
            });

            salvar();
            closeModal(tipo === 'IN' ? 'modalEntrada' : 'modalSaida');
        }

        function salvar() {
            localStorage.setItem('inj_produtos', JSON.stringify(produtos));
            localStorage.setItem('inj_logs', JSON.stringify(logs));
            renderizar();
        }

        function renderizar() {
            const lista = document.getElementById('listaProdutos');
            lista.innerHTML = '';
            produtos.forEach(p => {
                let status = p.qty <= p.min ? '<span class="badge" style="background:var(--danger)">ALERTA</span>' : '<span class="badge" style="background:var(--success)">OK</span>';
                lista.innerHTML += `<tr><td>${p.code}</td><td>${p.desc}</td><td>${p.qty}</td><td>${status}</td></tr>`;
            });

            const listaL = document.getElementById('listaLogs');
            listaL.innerHTML = '';
            logs.slice(0, 8).forEach(l => {
                listaL.innerHTML += `<tr><td>${l.data}</td><td>${l.txt}</td></tr>`;
            });
        }

        renderizar();
    </script>
</body>
</html>
