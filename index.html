<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Checklist Completo de Injetoras</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; font-size: 0.85em; }
        .status-block { margin: 20px 0; padding: 15px; border-radius: 5px; text-align: center; background: #e2e3e5; }
        .obs-input { width: 100%; box-sizing: border-box; }
        select { padding: 10px; width: 100%; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Checklist de Injetoras</h2>
    
    <label>Momento da Verificação:</label>
    <select id="tipoChecklist" onchange="filtrarChecklist()">
        <option value="inicio">Início de Processo</option>
        <option value="durante">Durante o Processo</option>
        <option value="parada">Parada de Máquina</option>
    </select>

    <form id="checklistForm">
        <table>
            <thead><tr><th>Item</th><th>Descrição</th><th>S</th><th>N</th><th>NA</th><th>Obs</th></tr></thead>
            <tbody id="checklist-body">
                </tbody>
        </table>

        <div class="status-block" id="statusBlock">
            <strong>Status:</strong> <span id="statusLabel">Aguardando preenchimento</span>
            <input type="hidden" name="status" id="statusFinal">
        </div>
        <button type="submit">Enviar para Firebase</button>
    </form>
</div>

<script>
    const itens = [
        { id: 1, desc: "Pinos extratores ok?", cat: "inicio durante parada" },
        { id: 2, desc: "Conexões água/óleo ok?", cat: "inicio durante parada" },
        { id: 3, desc: "Sensores de temp. ok?", cat: "inicio" },
        { id: 4, desc: "Câmara quente ok?", cat: "inicio durante parada" },
        { id: 5, desc: "Alinhamento de buchas?", cat: "inicio durante" },
        { id: 10, desc: "Ventilação de gás ok?", cat: "durante" },
        { id: 13, desc: "Molde fechado?", cat: "parada" },
        { id: 42, desc: "Tempo de ciclo ok?", cat: "durante" },
        { id: 45, desc: "Peças identificadas?", cat: "durante" }
        // ... adicione os outros 45 itens seguindo este padrão
    ];

    // Gerar tabela automaticamente
    const body = document.getElementById('checklist-body');
    itens.forEach(item => {
        body.innerHTML += `
            <tr class="${item.cat}">
                <td>${item.id}</td>
                <td>${item.desc}</td>
                <td><input type="radio" name="i${item.id}" value="S" onclick="evalStatus()"></td>
                <td><input type="radio" name="i${item.id}" value="N" onclick="evalStatus()"></td>
                <td><input type="radio" name="i${item.id}" value="NA" onclick="evalStatus()"></td>
                <td><input type="text" class="obs-input"></td>
            </tr>`;
    });

    function filtrarChecklist() {
        const tipo = document.getElementById('tipoChecklist').value;
        document.querySelectorAll('#checklist-body tr').forEach(tr => {
            const visivel = tr.classList.contains(tipo);
            tr.style.display = visivel ? 'table-row' : 'none';
            if (!visivel) {
                tr.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
                tr.querySelector('.obs-input').value = '';
            }
        });
        evalStatus();
    }

    function evalStatus() {
        const visiveis = document.querySelectorAll('#checklist-body tr[style="display: table-row;"]');
        const marcados = document.querySelectorAll('#checklist-body tr[style="display: table-row;"] input[type="radio"]:checked');
        
        if (visiveis.length > 0 && marcados.length >= visiveis.length) {
            const falhas = document.querySelectorAll('#checklist-body tr[style="display: table-row;"] input[value="N"]:checked');
            const status = falhas.length > 0 ? "BLOQUEADO" : "LIBERADO";
            document.getElementById('statusLabel').innerText = status;
            document.getElementById('statusBlock').style.background = falhas.length > 0 ? '#f8d7da' : '#d4edda';
            document.getElementById('statusFinal').value = status;
        }
    }

    window.onload = filtrarChecklist;
</script>
</body>
</html>
