<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pro - Controle de Fluxo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --light: #ecf0f1;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: #f8f9fa; }
        .sidebar { width: 240px; height: 100vh; background: var(--primary); color: white; position: fixed; }
        .sidebar h2 { text-align: center; padding: 20px; color: var(--secondary); border-bottom: 1px solid #34495e; }
        .main-content { margin-left: 240px; padding: 30px; width: 100%; }
        
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 25px 0; }
        .card { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #fdfdfd; padding: 15px; text-align: left; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; }

        /* Botões de Entrada e Saída */
        .btn-flow { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 0 2px; }
        .btn-in { background: var(--success); color: white; }
        .btn-out { background: var(--warning); color: white; }
        
        .pill { padding: 5px 10px; border-radius: 12px; font-size: 11px; color: white; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
        .modal-content { background: white; width: 400px; margin: 100px auto; padding: 30px; border-radius: 10px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>E-PRO</h2>
        <div style="padding: 20px; font-size: 0.8rem; color: #bdc3c7;">CONTROLE DE INJEÇÃO</div>
    </aside>

    <main class="main-content">
        <header>
            <h1>Entrada e Saída de Materiais</h1>
            <button onclick="document.getElementById('modalAdd').style.display='block'" style="padding: 10px 20px; background: var(--secondary); color: white; border: none; border-radius: 5px; cursor: pointer;">+ Novo Material</button>
        </header>

        <section class="dashboard">
            <div class="card">
                <h3>Total em Itens</h3>
                <div id="total-qty" style="font-size: 2rem; font-weight: bold;">0</div>
            </div>
            <div class="card">
                <h3>Itens em Alerta</h3>
                <div id="alert-qty" style="font-size: 2rem; font-weight: bold; color: var(--danger);">0</div>
            </div>
        </section>

        <section class="container">
            <table>
                <thead>
                    <tr>
                        <th>Cód.</th>
                        <th>Descrição</th>
                        <th>Estoque Atual</th>
                        <th>Mínimo</th>
                        <th>Status</th>
                        <th>Movimentar</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </section>
    </main>

    <!-- Modal Novo Item -->
    <div id="modalAdd" class="modal">
        <div class="modal-content">
            <h3>Cadastrar Novo Material</h3>
            <input type="text" id="code" placeholder="Código">
            <input type="text" id="desc" placeholder="Descrição">
            <input type="number" id="qty" placeholder="Quantidade Inicial">
            <input type="number" id="min" placeholder="Estoque Mínimo">
            <button onclick="addItem()" style="width: 100%; padding: 10px; background: var(--success); color: white; border: none; border-radius: 5px;">Salvar</button>
            <button onclick="document.getElementById('modalAdd').style.display='none'" style="width: 100%; margin-top: 10px; background: none; border: none; color: #666;">Cancelar</button>
        </div>
    </div>

    <script>
        // No futuro, aqui você conectará com o Firebase para salvar online
        let db = JSON.parse(localStorage.getItem('cloud_estoque_v1')) || [];

        function render() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let total = 0;
            let alerts = 0;

            db.forEach((item, index) => {
                let status = "OK";
                let color = varName('--success');
                if (item.qty <= (item.min * 0.5)) { status = "CRÍTICO"; color = varName('--danger'); alerts++; }
                else if (item.qty <= item.min) { status = "ALERTA"; color = varName('--warning'); alerts++; }

                total += parseInt(item.qty);

                tbody.innerHTML += `
                    <tr>
                        <td>${item.code}</td>
                        <td>${item.desc}</td>
                        <td style="font-weight: bold; font-size: 1.2rem;">${item.qty}</td>
                        <td>${item.min}</td>
                        <td><span class="pill" style="background:${color}">${status}</span></td>
                        <td>
                            <button class="btn-flow btn-in" onclick="changeQty(${index}, 1)">+ Entrada</button>
                            <button class="btn-flow btn-out" onclick="changeQty(${index}, -1)">- Saída</button>
                        </td>
                        <td><button onclick="removeItem(${index})" style="background:none; border:none; color:red; cursor:pointer;">🗑️</button></td>
                    </tr>
                `;
            });

            document.getElementById('total-qty').innerText = total;
            document.getElementById('alert-qty').innerText = alerts;
            localStorage.setItem('cloud_estoque_v1', JSON.stringify(db));
        }

        function varName(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }

        function addItem() {
            const item = {
                code: document.getElementById('code').value,
                desc: document.getElementById('desc').value,
                qty: parseInt(document.getElementById('qty').value),
                min: parseInt(document.getElementById('min').value)
            };
            db.push(item);
            document.getElementById('modalAdd').style.display='none';
            render();
        }

        // FUNÇÃO PRINCIPAL DE CONTROLE
        function changeQty(index, amount) {
            const novoValor = db[index].qty + amount;
            
            if (novoValor < 0) {
                alert("Erro: O estoque não pode ser negativo!");
                return;
            }

            db[index].qty = novoValor;
            render();
        }

        function removeItem(index) {
            if(confirm("Excluir material?")) {
                db.splice(index, 1);
                render();
            }
        }

        render();
    </script>
</body>
</html>
