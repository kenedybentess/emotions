<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema Bentes Industrial</title>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<!-- QZ Tray -->

<script src="https://cdn.jsdelivr.net/npm/qz-tray/qz-tray.js"></script>

<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:20px}
input,select,button{padding:10px;margin:5px;border-radius:8px;border:none}
button{background:#22c55e;font-weight:bold;cursor:pointer}
</style>

</head>

<body>

<h1>🏭 Sistema Bentes Industrial</h1>

<div class="card">
<h3>Produção</h3>

<input id="codigo" placeholder="Código">
<input id="ordem" placeholder="Ordem">
<input id="qtd" type="number" placeholder="Quantidade">

<select id="maquina">
<option>Injetora 01</option>
<option>Injetora 02</option>
</select>

<select id="turno">
<option>Manhã</option>
<option>Tarde</option>
<option>Noite</option>
</select>

<input id="cavidade" placeholder="Cavidade">

<button onclick="registrar()">Registrar Produção</button>

</div>

<script>

// 🔥 CONFIGURE SEU FIREBASE AQUI
const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "SEU_DOMINIO",
  projectId: "SEU_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🔄 ESCUTA PRODUÇÃO EM TEMPO REAL
db.collection("producao").onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
        if (change.type === "added") {
            imprimir(change.doc.data());
        }
    });
});

// 📥 REGISTRAR PRODUÇÃO
function registrar(){

    db.collection("producao").add({
        codigo: codigo.value,
        ordem: ordem.value,
        qtd: qtd.value,
        maquina: maquina.value,
        turno: turno.value,
        cavidade: cavidade.value,
        data: new Date()
    });

    codigo.value="";
    ordem.value="";
    qtd.value="";
    cavidade.value="";
}

// 🖨️ IMPRESSÃO DIRETA AUTOMÁTICA
async function imprimir(d){

    try{

        await qz.websocket.connect();

        let nomeCorreto = "SNBC BTP-7400 BPLE (203 dpi)";
        let printers = await qz.printers.find();

        let impressora = printers.includes(nomeCorreto)
            ? nomeCorreto
            : printers.find(p => p.toUpperCase().includes("SNBC"));

        if(!impressora){
            alert("Impressora SNBC não encontrada!");
            return;
        }

        const config = qz.configs.create(impressora);

        let dataPrint = [
            '\\x1B\\x40',
            'BENTES INDUSTRIAL\\n',
            'CONTROLE SEMI ACABADO\\n',
            '--------------------------\\n',
            'OP: ' + d.ordem + '\\n',
            'QTD: ' + d.qtd + '\\n',
            new Date().toLocaleString() + '\\n',
            '--------------------------\\n',
            'PRODUTO: ' + d.codigo + '\\n',
            '\\n' + d.codigo + '\\n\\n\\n',
            '\\x1D\\x56\\x00'
        ];

        await qz.print(config, dataPrint);

        qz.websocket.disconnect();

    }catch(e){
        console.error(e);
    }
}

</script>

</body>
</html>
