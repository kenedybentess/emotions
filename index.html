<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pro - Gestão de Injeção</title>
    <!-- Chart.js para o gráfico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --warning-color: #f1c40f;
            --light-bg: #f4f7f6;
            --text-color: #333;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: var(--light-bg); display: flex; color: var(--text-color); }
        
        /* Sidebar */
        .sidebar { width: 250px; height: 100vh; background-color: var(--primary-color); color: white; position: fixed; transition: 0.3s; }
        .sidebar h2 { text-align: center; color: var(--secondary-color); margin-top: 20px; font-size: 1.5rem; }
        .sidebar nav a { display: block; color: white; padding: 15px 25px; text-decoration: none; transition: 0.3s; }
        .sidebar nav a:hover { background-color: var(--secondary-color); }

        /* Main Content */
        .main-content { margin-left: 250px; padding: 30px; width: calc(100% - 250px); min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Dash Cards */
        .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin: 20px 0; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { margin: 0; font-size: 0.9rem; color: #7f8c8d; }
        .card .value { font-size: 2rem; font-weight: bold; margin-top: 10px; }
        .card.status-critico { border-top: 5px solid var(--danger-color); }

        /* Table Area */
        .table-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; }
        .search-bar { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn-add { background: var(--success-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add:hover { opacity: 0.9; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table th { background-color: #f8f9fa; color: var(--primary-color); padding: 15px; text-align: left; border-bottom: 2px solid #eee; }
        table td { padding: 15px; border-bottom: 1px solid #eee; }
        
        .status-pill { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; color: white; text-transform: uppercase; }
        .btn-delete { background: none; border: 1px solid var(--danger-color); color: var(--danger-color); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-delete:hover { background: var(--danger-color); color: white; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); }
        .modal-content { background: white; width: 400px; margin: 8% auto; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-content h3 { margin-top: 0; color: var(--primary-color); }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar h2, .sidebar span { display: none; }
            .main-content { margin-left: 70px; width: calc(100% - 70px); }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>E-Pro</h2>
        <nav>
            <a href="#">🏠 <span>Dashboard</span></a>
            <a href="#">📦 <span>Produtos</span></a>
            <a href="#">📊 <span>Relatórios</span></a>
            <a href="#">⚙️ <span>Configurações</span></a>
        </nav>
    </div>

    <div class="main-content">
        <header>
            <h1>Painel de Gestão - Injeção</h1>
            <div class="user-info">Olá, <strong>Admin</strong></div>
        </header>

        <div class="dashboard-cards">
            <div class="card">
                <h3>Total de Itens</h3>
                <div class="value" id="total-items">0</div>
            </div>
            <div class="card status-critico">
                <h3>Atenção Necessária</h3>
                <div class="value" id="critico-count" style="color: var(--danger-color);">0</div>
            </div>
            <div class="card">
                <canvas id="healthChart" style="max-height: 80px;"></canvas>
            </div>
        </div>

        <div class="table-container">
            <div class="controls">
                <input type="text" id="search" class="search-bar" placeholder="Buscar por código ou descrição...">
                <button class="btn-add" onclick="toggleModal(true)">+ Novo Produto</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Cód. Produto</th>
                        <th>Descrição</th>
                        <th>Qtd. Atual</th>
                        <th>Mín. Exigido</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="inventory-body">
                    <!-- Gerado via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Cadastro -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>Cadastrar Novo Item</h3>
            <input type="text" id="p-code" placeholder="Código (Ex: #MAT-01)">
            <input type="text" id="p-desc" placeholder="Descrição do Produto">
            <input type="number" id="p-qty" placeholder="Quantidade em Estoque">
            <input type="number" id="p-min" placeholder="Estoque Mínimo de Segurança">
            
            <div class="modal-actions">
                <button onclick="toggleModal(false)" style="background:none; border:none; color:#7f8c8d; cursor:pointer;">Cancelar</button>
                <button class="btn-add" onclick="addProduct()">Salvar Item</button>
            </div>
        </div>
    </div>

    <script>
        // Dados iniciais e LocalStorage
        let inventory = JSON.parse(localStorage.getItem('estoque_dados_injecao')) || [
            { code: '#INJ-001', desc: 'Molde Plástico A1', qty: 50, min: 20 },
            { code: '#MAT-042', desc: 'Resina Polipropileno', qty: 8, min: 25 }
        ];

        let myChart;

        function toggleModal(show) {
            document.getElementById('modal').style.display = show ? 'block' : 'none';
        }

        // Adicionar Produto
        function addProduct() {
            const code = document.getElementById('p-code').value;
            const desc = document.getElementById('p-desc').value;
            const qty = parseInt(document.getElementById('p-qty').value);
            const min = parseInt(document.getElementById('p-min').value);

            if (code && desc && !isNaN(qty) && !isNaN(min)) {
                inventory.push({ code, desc, qty, min });
                saveAndRefresh();
                toggleModal(false);
                // Limpa campos
                document.querySelectorAll('.modal-content input').forEach(i => i.value = '');
            } else {
                alert("Por favor, preencha todos os campos corretamente.");
            }
        }

        // Remover Produto
        function deleteProduct(index) {
            if(confirm("Deseja realmente excluir este item?")) {
                inventory.splice(index, 1);
                saveAndRefresh();
            }
        }

        // Atualizar Interface
        function updateUI() {
            const tbody = document.getElementById('inventory-body');
            tbody.innerHTML = '';
            let criticoTotal = 0;

            inventory.forEach((item, index) => {
                let statusText = 'OK';
                let statusClass = 'var(--success-color)';

                // Lógica de Status Baseada no Mínimo
                if (item.qty <= (item.min * 0.5)) {
                    statusText = 'CRÍTICO';
                    statusClass = 'var(--danger-color)';
                    criticoTotal++;
                } else if (item.qty <= item.min) {
                    statusText = 'ALERTA';
                    statusClass = 'var(--warning-color)';
                    criticoTotal++;
                }

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${item.code}</strong></td>
                        <td>${item.desc}</td>
                        <td>${item.qty}</td>
                        <td>${item.min}</td>
                        <td><span class="status-pill" style="background:${statusClass}">${statusText}</span></td>
                        <td>
                            <button class="btn-delete" onclick="deleteProduct(${index})">Excluir</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('total-items').innerText = inventory.length;
            document.getElementById('critico-count').innerText = criticoTotal;
            
            updateChart();
        }

        function saveAndRefresh() {
            localStorage.setItem('estoque_dados_injecao', JSON.stringify(inventory));
            updateUI();
        }

        // Gráfico de Saúde do Estoque
        function updateChart() {
            const okItems = inventory.filter(i => i.qty > i.min).length;
            const alertItems = inventory.filter(i => i.qty <= i.min).length;

            const ctx = document.getElementById('healthChart').getContext('2d');
            
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Estável', 'Atenção'],
                    datasets: [{
                        data: [okItems, alertItems],
                        backgroundColor: ['#27ae60', '#e74c3c'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '70%',
                    plugins: { legend: { display: false } }
                }
            });
        }

        // Busca em Tempo Real
        document.getElementById('search').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#inventory-body tr');
            
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(term) ? '' : 'none';
            });
        });

        // Inicialização
        updateUI();
    </script>
</body>
</html>
