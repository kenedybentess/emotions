<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Etiqueta - Layout Fiel</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        /* Configurações de Impressão e Reset */
        @page { size: 100mm 140mm; margin: 0; }
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 20px; background: #525659; display: flex; justify-content: center; }

        /* Painel de Edição Lateral */
        .painel { 
            width: 300px; background: white; padding: 20px; border-radius: 8px; 
            margin-right: 20px; height: fit-content; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .painel h3 { margin-top: 0; color: #333; }
        .painel input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn-print { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* Container da Etiqueta (Baseado na imagem_dbdb90.png) */
        .etiqueta {
            width: 130mm;
            height: 95mm;
            background: white;
            border: 4px solid black;
            display: grid;
            grid-template-columns: 75px 1fr 100px; /* Coluna Elgin | Centro | Coluna Selo */
            overflow: hidden;
        }

        /* Divisões e Bordas */
        .borda-direita { border-right: 3px solid black; }
        .borda-esquerda { border-left: 3px solid black; }
        .borda-inferior { border-bottom: 2px solid black; }

        /* Coluna 1: Logo Elgin */
        .col-elgin {
            display: flex; align-items: center; justify-content: center;
            writing-mode: vertical-rl; transform: rotate(180deg);
            font-size: 38px; font-weight: 900; letter-spacing: -2px;
        }

        /* Coluna 2: Informações Centrais */
        .col-central { display: flex; flex-direction: column; }
        .secao-cnpj { padding: 4px 10px; font-weight: bold; font-size: 14px; }
        .secao-detalhes { padding: 8px 10px; font-size: 11px; line-height: 1.2; height: 75px; }
        
        .secao-barcode { 
            flex-grow: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 5px 0;
        }
        .secao-barcode span { font-size: 10px; font-weight: bold; margin-bottom: 2px; }
        canvas { max-width: 95%; height: auto; }

        /* Coluna 3: Selo e Data */
        .col-direita { display: grid; grid-template-rows: 1fr 90px; }
        .area-selo { display: flex; align-items: center; justify-content: center; padding: 10px; }
        .selo-circular {
            border: 2px solid black; border-radius: 50%; width: 80px; height: 80px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; font-size: 8px; font-weight: bold;
        }
        .area-data { 
            border-top: 3px solid black; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; font-weight: bold; 
        }

        /* Esconder painel na impressão */
        @media print {
            .painel { display: none; }
            body { padding: 0; background: white; }
            .etiqueta { border: 4px solid black; }
        }
    </style>
</head>
<body>

    <div class="painel">
        <h3>Editar Dados</h3>
        <label>Nome do Produto:</label>
        <input type="text" id="in_nome" value="IMPRESSORA TERMICA BEMA MP4200 HS" oninput="update()">
        <label>Código Elgin:</label>
        <input type="text" id="in_cod" value="46B4200HS001" oninput="update()">
        <label>EAN-13:</label>
        <input type="text" id="in_ean" value="7908412525957" oninput="update()">
        <label>Nº de Série:</label>
        <input type="text" id="in_serial" value="12345678" oninput="update()">
        <label>Responsável QC:</label>
        <input type="text" id="in_qc" value="21" oninput="update()">
        <button class="btn-print" onclick="window.print()">IMPRIMIR</button>
    </div>

    <div class="etiqueta">
        <!-- Lado Elgin -->
        <div class="col-elgin borda-direita">'elgin</div>

        <!-- Parte Central -->
        <div class="col-central">
            <div class="secao-cnpj borda-inferior">CNPJ: 14.200.166/0005-90</div>
            <div class="secao-detalhes borda-inferior">
                <strong id="txt_nome">IMPRESSORA TERMICA BEMA MP4200 HS</strong><br>
                VERSÃO DO FIRMWARE: 7.010CR2N<br>
                CÓDIGO DO PRODUTO ELGIN: <span id="txt_cod_desc">46B4200HS001</span><br>
                QTD: 01 &nbsp; VOL: 01
            </div>
            <div class="secao-barcode borda-inferior">
                <span>CÓDIGO ELGIN</span>
                <canvas id="bar_elgin"></canvas>
            </div>
            <div class="secao-barcode borda-inferior">
                <span>CÓDIGO EAN 13</span>
                <canvas id="bar_ean"></canvas>
            </div>
            <div class="secao-barcode">
                <span>NUMERO DE SERIE</span>
                <canvas id="bar_serial"></canvas>
            </div>
        </div>

        <!-- Lado Selo/Data -->
        <div class="col-direita borda-esquerda">
            <div class="area-selo">
                <div class="selo-circular">
                    CONTROLE DE QUALIDADE<br>
                    <span style="font-size: 26px;" id="txt_qc">21</span><br>
                    APROVADO
                </div>
            </div>
            <div class="area-data">
                <small>DATA</small>
                <span style="font-size: 16px;" id="txt_data">05/05/2026</span>
            </div>
        </div>
    </div>

    <script>
        function update() {
            // Atualizar Textos
            document.getElementById('txt_nome').innerText = document.getElementById('in_nome').value;
            document.getElementById('txt_cod_desc').innerText = document.getElementById('in_cod').value;
            document.getElementById('txt_qc').innerText = document.getElementById('in_qc').value;
            document.getElementById('txt_data').innerText = new Date().toLocaleDateString('pt-BR');

            // Gerar Códigos de Barras
            try {
                JsBarcode("#bar_elgin", document.getElementById('in_cod').value, { height: 35, fontSize: 14 });
                JsBarcode("#bar_ean", document.getElementById('in_ean').value, { format: "EAN13", height: 35, fontSize: 14 });
                JsBarcode("#bar_serial", document.getElementById('in_serial').value, { format: "CODE128", height: 35, fontSize: 14 });
            } catch(e) {}
        }
        update(); // Inicializa
    </script>
</body>
</html>
