<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta Estoque Pro - Identica</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @page { size: landscape; margin: 0; }
        body { font-family: 'Arial', sans-serif; background: #333; display: flex; justify-content: center; padding: 20px; }

        .no-print { width: 250px; background: white; padding: 15px; margin-right: 20px; border-radius: 8px; height: fit-content; }
        .no-print input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }

        /* Container Principal */
        .etiqueta-container {
            width: 140mm;
            height: 105mm;
            background: white;
            border: 6px solid black;
            display: grid;
            grid-template-columns: 85px 1fr 130px;
            color: black;
        }

        /* Coluna Lateral Esquerda */
        .col-logo { 
            display: flex; flex-direction: column; border-right: 5px solid black; 
        }
        .logo-img-wrapper { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
        }
        .logo-img-wrapper img { width: 60px; } /* Imagem elgin.png */
        
        .cnpj-txt { 
            height: 45px; border-top: 5px solid black; display: flex; align-items: center; 
            justify-content: center; font-weight: bold; font-size: 14px;
            writing-mode: vertical-rl; transform: rotate(180deg);
        }

        /* Conteúdo Central */
        .col-content { display: flex; flex-direction: column; }
        .details { padding: 10px; font-size: 12px; font-weight: bold; border-bottom: 5px solid black; line-height: 1.3; }
        
        .bc-box { 
            flex: 1; border-bottom: 5px solid black; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center;
        }
        .bc-box span { font-size: 10px; font-weight: 900; }
        canvas { max-width: 95%; height: auto; }

        /* Coluna Direita */
        .col-right { display: grid; grid-template-rows: 1fr 80px 100px; border-left: 5px solid black; }
        .selo-wrapper { display: flex; align-items: center; justify-content: center; padding: 5px; }
        .selo-wrapper img { width: 110px; } /* Imagem selo.png */

        .data-wrapper { 
            border-top: 5px solid black; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; font-weight: 900; font-size: 18px; 
        }
        
        .polo-wrapper { 
            border-top: 5px solid black; display: flex; align-items: center; 
            justify-content: center; text-align: center; font-size: 9px; font-weight: bold;
        }

        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <h3>Dados da Etiqueta</h3>
    <input type="text" id="in_nome" value="IMPRESSORA TERMICA BEMA MP4200 HS" oninput="update()">
    <input type="text" id="in_cod" value="46B4200HS001" oninput="update()">
    <input type="text" id="in_ean" value="7908412525957" oninput="update()">
    <input type="text" id="in_ser" value="12345678" oninput="update()">
    <button onclick="window.print()" style="width:100%; cursor:pointer; padding:10px; font-weight:bold;">IMPRIMIR</button>
</div>

<div class="etiqueta-container">
    <div class="col-logo">
        <div class="logo-img-wrapper"><img src="elgin.png"></div>
        <div class="cnpj-txt">CNPJ: 14.200.166/0005-90</div>
    </div>

    <div class="col-content">
        <div class="details">
            <span id="txt_nome">IMPRESSORA TERMICA BEMA MP4200 HS</span><br>
            VERSÃO DO FIRMWARE: 7.010CR2N<br>
            CÓDIGO: <span id="txt_cod">46B4200HS001</span><br>
            QTD: 01 &nbsp; VOL: 01
        </div>
        <div class="bc-box">
            <span>CÓDIGO ELGIN</span>
            <canvas id="bar_elgin"></canvas>
        </div>
        <div class="bc-box">
            <span>CÓDIGO EAN 13</span>
            <canvas id="bar_ean"></canvas>
        </div>
        <div class="bc-box" style="border-bottom: none;">
            <span>NUMERO DE SERIE</span>
            <canvas id="bar_ser"></canvas>
        </div>
    </div>

    <div class="col-right">
        <div class="selo-wrapper"><img src="selo.png"></div>
        <div class="data-wrapper">
            <small style="font-size: 10px;">DATA</small>
            <span>05/05/2026</span>
        </div>
        <div class="polo-wrapper">
            PRODUZIDO NO<br>PÓLO INDUSTRIAL<br>DE MANAUS<br><br>CONHEÇA A AMAZÔNIA
        </div>
    </div>
</div>

<script>
    function update() {
        document.getElementById('txt_nome').innerText = document.getElementById('in_nome').value;
        document.getElementById('txt_cod').innerText = document.getElementById('in_cod').value;

        const opt = { height: 35, displayValue: true, fontSize: 14, margin: 0 };
        JsBarcode("#bar_elgin", document.getElementById('in_cod').value, opt);
        JsBarcode("#bar_ean", document.getElementById('in_ean').value, { ...opt, format: "EAN13" });
        JsBarcode("#bar_ser", document.getElementById('in_ser').value, opt);
    }
    update();
</script>

</body>
</html>
