<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist & Dashboard de Injetoras</title>
    
    <script src="https://jsdelivr.net"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --danger-color: #e74c3c;
            --light-bg: #f8f9fa;
            --border-color: #dee2e6;
            --text-dark: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #eef2f5; color: var(--text-dark); padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* Navegação por Abas */
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; border: none; background: #ddd; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 1em; transition: 0.2s; }
        .tab-btn.active { background: var(--primary-color); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        header { text-align: center; border-bottom: 3px solid var(--primary-color); padding-bottom: 20px; margin-bottom: 25px; }
        .logo-placeholder { font-size: 0.85em; font-weight: bold; color: #7f8c8d; margin-bottom: 5px; letter-spacing: 1px; }
        h1 { color: var(--primary-color); font-size: 1.8em; text-transform: uppercase; }
        
        /* Formulário */
        .meta-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: var(--light-bg); padding: 20px; border-radius: 6px; margin-bottom: 25px; border: 1px solid var(--border-color); }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.85em; font-weight: 600; margin-bottom: 5px; }
        .form-group input, .form-group select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95em; }
        
        .section-title { background: var(--primary-color); color: white; padding: 10px 15px; font-size: 1.1em; font-weight: 600; margin-top: 25px; margin-bottom: 10px; border-radius: 4px; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        th, td { border: 1px solid var(--border-color); padding: 10px 12px; font-size: 0.95em; }
        th { background-color: #f1f4f6; color: var(--primary-color); font-weight: 600; }
        .radio-cell { text-align: center; }
        .radio-cell input { transform: scale(1.2); cursor: pointer; }
        .obs-input { width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        
        /* Status de Liberação */
        .status-block { background: #e2e3e5; border: 1px solid #ced4da; padding: 20px; border-radius: 6px; margin-top: 25px; transition: background 0.3s; }
        .status-block.liberado { background: #d1e7dd; border-color: #badbcc; }
        .status-block.bloqueado { background: #f8d7da; border-color: #f5c2c7; }
        .status-options { display: flex; gap: 20px; margin-top: 10px; }
        .status-option { display: flex; align-items: center; gap: 8px; font-weight: bold; cursor: pointer; }
        .status-option input { transform: scale(1.3); }
        .text-success { color: #0f5132; }
        .text-danger { color: #842029; }
        
        .actions { margin-top: 30px; display: flex; justify-content: flex-end; gap: 15px; }
        .btn { padding: 12px 24px; border: none; border-radius: 4px; font-size: 1em; font-weight: bold; cursor: pointer; color: white; transition: background 0.2s; }
        .btn-success { background-color: var(--secondary-color); }
        .btn-success:hover { background-color: #149c82; }
        .btn-primary { background-color: var(--primary-color); }
        .btn-primary:hover { background-color: #1a252f; }

        /* Dashboard */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: var(--light-bg); padding: 15px; border-radius: 6px; border: 1px solid var(--border-color); text-align: center; }
        .card h3 { font-size: 0.85em; text-transform: uppercase; color: #666; }
        .card p { font-size: 1.6em; font-weight: bold; margin-top: 5px; }
        
        .chart-container { background: white; padding: 20px; border-radius: 6px; border: 1px solid var(--border-color); height: 350px; position: relative; margin-bottom: 30px; }

        @media print { .tabs, .actions, .status-block input { display: none !important; } }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button id="btn-tab-checklist" class="tab-btn active" onclick="switchTab('checklist-tab')">📝 Realizar/Ver Checklist</button>
        <button id="btn-tab-dashboard" class="tab-btn" onclick="switchTab('dashboard-tab')">📊 Dashboard Mensal</button>
    </div>

    <!-- ABA 1: CHECKLIST -->
    <div id="checklist-tab" class="tab-content active">
        <header>
            <div class="logo-placeholder">SISTEMA DE GESTÃO DE SEGURANÇA E PROCESSO INTERNO</div>
            <h1>Checklist Unificado de Injetoras</h1>
        </header>

        <form id="checklistForm">
            <div class="meta-form">
                <div class="form-group"><label>Data:</label><input type="date" id="data" required></div>
                <div class="form-group">
                    <label>Turno:</label>
                    <select id="turno" required>
                        <option value="" disabled selected>Selecione o Turno</option>
                        <option value="1º Turno">1º Turno</option>
                        <option value="2º Turno">2º Turno</option>
                        <option value="3º Turno">3º Turno</option>
                    </select>
                </div>
                <div class="form-group"><label>Injetora (ID/Nº):</label><input type="text" id="injetora" placeholder="Ex: INJ-05" required></div>
                <div class="form-group"><label>Operador:</label><input type="text" id="operador" placeholder="Nome Completo" required></div>
            </div>

            <!-- Div onde a lista dinâmica dos 45 itens será renderizada -->
            <div id="tables-container"></div>

            <div class="status-block" id="statusBlock">
                <label style="font-weight: bold; font-size: 1.1em;">Status Final do Equipamento:</label>
                <div class="status-options">
                    <label class="status-option text-success">
                        <input type="radio" name="statusFinal" value="LIBERADO" onclick="updateStatusBg('liberado')" required> 🟢 LIBERADO
                    </label>
                    <label class="status-option text-danger">
                        <input type="radio" name="statusFinal" value="BLOQUEADO" onclick="updateStatusBg('bloqueado')"> 🔴 BLOQUEADO
                    </label>
                </div>
            </div>

            <div class="actions">
                <button type="button" class="btn btn-primary" onclick="window.print()">🖨️ Imprimir PDF</button>
                <button type="submit" class="btn btn-success">💾 Salvar no Firebase</button>
            </div>
        </form>
    </div>

    <!-- ABA 2: DASHBOARD -->
    <div id="dashboard-tab" class="tab-content">
        <h2>Indicadores Mensais</h2>
        <div class="dashboard-grid" style="margin-top: 20px;">
            <div class="card"><h3>Total de Inspeções</h3><p id="dash-total">12</p></div>
            <div class="card" style="color: var(--secondary-color);"><h3>Liberadas</h3><p id="dash-liberadas">10</p></div>
            <div class="card" style="color: var(--danger-color);"><h3>Bloqueadas</h3><p id="dash-bloqueadas">2</p></div>
        </div>
        <div class="chart-container">
            <canvas id="analyticsChart"></canvas>
        </div>
    </div>
</div>

<script>
    document.getElementById('data').valueAsDate = new Date();

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if(tabId === 'checklist-tab') document.getElementById('btn-tab-checklist').classList.add('active');
        if(tabId === 'dashboard-tab') {
            document.getElementById('btn-tab-dashboard').classList.add('active');
            renderChart();
        }
    }

    function updateStatusBg(status) {
        const block = document.getElementById('statusBlock');
        block.className = 'status-block ' + status;
    }

    // LISTA COMPLETA DOS 45 ITENS DA PLANILHA ENVIADA
    const checklistDados = [
        {
            titulo: "1. Molde",
            itens: [
                { id: 1, desc: "Os pinos extratores estão funcionando corretamente e sem travamentos?" },
                { id: 2, desc: "As conexões de água/óleo do molde estão vedadas e sem vazamentos?" },
                { id: 3, desc: "Os sensores de temperatura, Datadores do molde estão calibrados e fornecendo leituras precisas?" },
                { id: 4, desc: "O sistema de câmara quente (se aplicável) está operando dentro das temperaturas especificadas?" },
                { id: 5, desc: "As buchas de injeção estão alinhadas corretamente com o bico da máquina?" },
