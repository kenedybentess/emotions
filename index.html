<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Etiquetas - Estoque Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        /* Estilos de Interface */
        :root {
            --primary-color: #2563eb;
            --bg-color: #f1f5f9;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); margin: 0; display: flex; height: 100vh; }

        /* Painel de Controle (Esquerda) */
        .sidebar { width: 350px; background: white; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.1); overflow-y: auto; }
        .sidebar h2 { color: var(--primary-color); font-size: 1.2rem; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; color: #475569; }
        input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        
        .btn-print { 
            width: 100%; padding: 12px; background: #059669; color: white; border: none; 
            border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; 
        }

        /* Área da Etiqueta (Direita) */
        .preview-area { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }

        /* Layout da Etiqueta Baseado no seu Modelo */
        .etiqueta-box {
            width: 140mm;
            height: 90mm;
            background: white;
            border: 2px solid #000;
            display: grid;
            grid-template-columns: 60px 1fr 100px; /* Logo | Dados | Selo/Data */
            color: #000;
        }

        .border-v { border-right: 2px solid #000; }
        .border-v-left { border-left: 2px solid #000; }
        .border-h { border-bottom: 1px solid #000; }

        .logo-vertical {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 900; letter-spacing: -2px;
        }

        .main-info { display: flex; flex-direction: column; }
        .info-row { padding: 5px 10px; font-size: 11px; line-height: 1.3; }
        .barcode-section { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .barcode-section span { font-size: 9px; font-weight: bold; margin-bottom: 2px; }
        svg { max-width: 90%; height: auto; }

        .side-info { display: grid; grid-template-rows: 1fr 80px; }
        .qc-section { display: flex; align-items: center; justify-content: center; padding: 10px; }
        .qc-circle { 
            border: 2px solid #000; border-radius: 50%; width: 75px; height: 75px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-size: 9px; text-align: center; font-weight: bold;
        }
        .date-section { border-top: 2px solid #000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }

        /* Configurações de Impressão */
        @media print {
            .sidebar { display: none; }
            body { background: white; }
            .preview-area { padding: 0; }
            .etiqueta-box { border: 2px solid #000; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>Configurar Etiqueta</h2>
    <div class="form-group">
        <label>Empresa / Logo Lateral</label>
        <input type="text" id="in_logo" value="'elgin" oninput="update()">
    </div>
    <div class="form-group">
        <label>Descrição do Produto</label>
        <input type="text" id="in_nome" value="IMPRESSORA TERMICA BEMA MP4200 HS" oninput="update()">
    </div>
    <div class="form-group">
        <label>Código do Produto</label>
        <input type="text" id="in_cod" value="46B4200HS001" oninput="update()">
    </div>
    <div class="form-group">
        <label>Código EAN-13 (Apenas números)</label>
        <input type="text" id="in_ean" value="7908412525957" oninput="update()">
    </div>
    <div class="form-group">
        <label>ID do Responsável (QC)</label>
        <input type="text" id="in_qc" value="21" oninput="update()">
    </div>
    <div class="form-group">
        <label>Data de Produção</label>
        <input type="date" id="in_data" oninput="update()">
    </div>
    <button class="btn-print" onclick="window.print()">IMPRIMIR ETIQUETA</button>
</div>

<div class="preview-area">
    <div class="etiqueta-box" id="print_area">
        <div class="logo-vertical border-v" id="txt_logo">'elgin</div>

        <div class="main-info">
            <div class="info-row border-h">
                <strong>CNPJ: 14.200.166/0005-90</strong>
            </div>
            <div class="info-row border-h">
                <strong id="txt_nome">IMPRESSORA TERMICA BEMA MP4200 HS</strong><br>
                VERSÃO DO FIRMWARE: 7.010CR2N<br>
                CÓDIGO: <span id="txt_cod_desc">46B4200HS001</span><br>
                QTD: 01 &nbsp; | &nbsp; VOL: 01
            </div>
            <div class="barcode-section border-h">
                <span>CÓDIGO DO PRODUTO</span>
                <svg id="barcode1"></svg>
            </div>
            <div class="barcode-section">
                <span>CÓDIGO EAN 13</span>
                <svg id="barcode2"></svg>
            </div>
        </div>

        <div class="side-info border-v-left">
            <div class="qc-section">
                <div class="qc-circle">
                    QUALIDADE<br>
                    <span style="font-size: 24px;" id="txt_qc">21</span><br>
                    APROVADO
                </div>
            </div>
            <div class="date-section">
                <small>DATA</small>
                <span id="txt_data">05/05/2026</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Define data de hoje como padrão
    document.getElementById('in_data').valueAsDate = new Date();

    function update() {
        // Atualiza Textos
        document.getElementById('txt_logo').innerText = document.getElementById('in_logo').value;
        document.getElementById('txt_nome').innerText = document.getElementById('in_nome').value;
        document.getElementById('txt_cod_desc').innerText = document.getElementById('in_cod').value;
        document.getElementById('txt_qc').innerText = document.getElementById('in_qc').value;
        
        // Formata Data
        const dataVal = new Date(document.getElementById('in_data').value);
        document.getElementById('txt_data').innerText = dataVal.toLocaleDateString('pt-BR');

        // Gera Barcodes
        try {
            JsBarcode("#barcode1", document.getElementById('in_cod').value, {
                format: "CODE128", height: 35, displayValue: true, fontSize: 12
            });
            JsBarcode("#barcode2", document.getElementById('in_ean').value, {
                format: "EAN13", height: 35, displayValue: true, fontSize: 12
            });
        } catch(e) { console.error("Erro no código de barras", e); }
    }

    // Inicializa
    update();
</script>

</body>
</html>
