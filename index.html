<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema Bentes Industrial 2.0</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode"></script>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:#fff;
    padding:20px;
}

h1{margin-bottom:20px}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

input,select,button{
    padding:10px;
    margin:5px;
    border-radius:8px;
    border:none;
}

button{
    background:#22c55e;
    font-weight:bold;
    cursor:pointer;
}

ul{list-style:none;padding:0}

li{
    background:#334155;
    margin:5px 0;
    padding:10px;
    border-radius:8px;
}
</style>

</head>

<body>

<h1>🏭 Sistema Bentes Industrial</h1>

<div class="card">
<h3>Produção</h3>

<input id="codigo" placeholder="Código do Produto">
<input id="ordem" placeholder="Ordem de Produção">
<input id="qtd" type="number" placeholder="Quantidade">

<br>

<select id="maquina">
<option>Injetora 01</option>
<option>Injetora 02</option>
<option>Injetora 03</option>
</select>

<select id="turno">
<option>Manhã</option>
<option>Tarde</option>
<option>Noite</option>
</select>

<input id="cavidade" placeholder="Cavidade">

<br>

<button onclick="registrar()">Registrar Produção</button> <button onclick="imprimir()">Imprimir Etiqueta</button>

</div>

<div class="card">
<h3>Histórico</h3>
<ul id="lista"></ul>
</div>

<script>

function registrar(){

    let item = {
        codigo: codigo.value,
        ordem: ordem.value,
        qtd: qtd.value,
        maquina: maquina.value,
        turno: turno.value,
        cavidade: cavidade.value,
        data: new Date().toLocaleString()
    };

    let dados = JSON.parse(localStorage.getItem("dados") || "[]");
    dados.push(item);
    localStorage.setItem("dados", JSON.stringify(dados));

    limpar();
    render();
}

function limpar(){
    codigo.value="";
    ordem.value="";
    qtd.value="";
    cavidade.value="";
}

function render(){

    let dados = JSON.parse(localStorage.getItem("dados") || "[]");

    lista.innerHTML="";

    dados.reverse().forEach(d => {

        let li = document.createElement("li");

        li.innerHTML = `
        <b>${d.codigo}</b> | QTD: ${d.qtd}<br>
        OP: ${d.ordem}<br>
        ${d.maquina} | ${d.turno}<br>
        Cavidade: ${d.cavidade}<br>
        ${d.data}
        `;

        lista.appendChild(li);
    });
}

function imprimir(){

    let codigo = document.getElementById("codigo").value;
    let ordem = document.getElementById("ordem").value;
    let qtd = document.getElementById("qtd").value;

    let data = new Date().toLocaleString();

    let win = window.open("", "", "width=400,height=600");

    win.document.write(`
    <html>
    <head>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode"></script>

</html>
