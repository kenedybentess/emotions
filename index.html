<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        /* Estilo Industrial Elgin */
        @page { size: landscape; margin: 0; }
        body { font-family: "Arial Black", sans-serif; background: #555; display: flex; justify-content: center; padding: 20px; }

        .etiqueta-real {
            width: 140mm;
            height: 102mm;
            background: white;
            border: 8px solid black; /* Borda externa bem grossa como na foto */
            display: grid;
            grid-template-columns: 85px 1fr 140px;
            color: black;
            box-sizing: border-box;
        }

        /* Divisões de Grade */
        .b-right { border-right: 6px solid black; }
        .b-left { border-left: 6px solid black; }
        .b-bottom { border-bottom: 6px solid black; }

        /* Coluna Esquerda: Logo e CNPJ */
        .col-elgin { display: flex; flex-direction: column; }
        .logo-box { flex: 1; display: flex; align-items: center; justify-content: center; }
        .logo-box img { width: 65px; transform: rotate(0deg); }
        .cnpj-box { 
            height: 55px; border-top: 6px solid black; 
            display: flex; align-items: center; justify-content: center;
            writing-mode: vertical-rl; transform: rotate(180deg);
            font-size: 13px; font-weight: 900;
        }

        /* Coluna Central: Dados e Barcodes */
        .col-dados { display: flex; flex-direction: column; }
        .header-info { 
            padding: 10px 15px; font-size: 13px; line-height: 1.3; 
            height: 95px; font-weight: 900; box-sizing: border-box;
        }
        .barcode-area { 
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 2px 0;
        }
        .barcode-area span { font-size: 10px; font-weight: 900; margin-bottom: 2px; }
        canvas { max-width: 95%; height: 42px !important; }

        /* Coluna Direita: Selo, Data e Polo */
        .col-selo { display: grid; grid-template-rows: 1.2fr 85px 115px; }
        .selo-img-box { display: flex; align-items: center; justify-content: center; }
        .selo-img-box img { width: 120px; }
        
        .data-box { 
            border-top: 6px solid black; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
        }
        .data-box b { font-size: 11px; }
        .data-box span { font-size: 22px; font-weight: 900; }

        .polo-box { border-top: 6px solid black; overflow: hidden; }
        .polo-box img { width: 100%; height: 100%; object-fit: cover; }

        /* Painel de Controle oculto na impressão */
        .no-print { width: 250px; background: white; padding: 20px; margin-right: 20px; border-radius: 10px; height: fit-content; }
        @media print { .no-print { display: none; } body { background: white; padding: 0; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

<div class="no-print">
    <h2 style="margin-top:0">Configurar</h2>
    <input type="text" id="in_nome" value="IMPRESSORA TERMICA BEMA MP4200 HS" style="width:100%; margin-bottom:10px" oninput="render()">
    <input type="text" id="in_cod" value="46B4200HS001" style="width:100%; margin-bottom:10px" oninput="render()">
    <input type="text" id="in_ean" value="7908412525957" style="width:100%; margin-bottom:10px" oninput="render()">
    <button onclick="window.print()" style="width:100%; padding:10px; cursor:pointer">IMPRIMIR</button>
</div>

<div class="etiqueta-real">
    <div class="col-elgin b-right">
        <div class="logo-box"><img src="image_db5b5b.png"></div> <!-- Logo Elgin -->
        <div class="cnpj-box">CNPJ: 14.200.166/0005-90</div>
    </div>

    <div class="col-dados">
        <div class="header-info b-bottom">
            <div style="font-size: 15px;" id="txt_n">IMPRESSORA TERMICA BEMA MP4200 HS</div>
            VERSÃO DO FIRMWARE: 7.010CR2N<br>
            CÓDIGO DO PRODUTO ELGIN: <span id="txt_c">46B4200HS001</span><br>
            QTD: 01 &nbsp; VOL: 01
        </div>
        <div class="barcode-area b-bottom">
            <span>CÓDIGO ELGIN</span>
            <canvas id="b1"></canvas>
        </div>
        <div class="barcode-area b-bottom">
            <span>CÓDIGO EAN 13</span>
            <canvas id="b2"></canvas>
        </div>
        <div class="barcode-area">
            <span>NÚMERO DE SÉRIE</span>
            <canvas id="b3"></canvas>
        </div>
    </div>

    <div class="col-selo b-left">
        <div class="selo-img-box"><img src="image_db5b75.png"></div> <!-- Selo Qualidade -->
        <div class="data-box">
            <b>DATA</b>
            <span>05/05/2026</span>
        </div>
        <div class="polo-box"><img src="image_db5456.png"></div> <!-- Polo Manaus -->
    </div>
</div>

<script>
    function render() {
        document.getElementById('txt_n').innerText = document.getElementById('in_nome').value;
        document.getElementById('txt_c').innerText = document.getElementById('in_cod').value;
        const s = { displayValue: true, fontSize: 16, fontOptions: "bold", margin: 0 };
        JsBarcode("#b1", document.getElementById('in_cod').value, s);
        JsBarcode("#b2", document.getElementById('in_ean').value, { ...s, format: "EAN13" });
        JsBarcode("#b3", "12345678", s);
    }
    window.onload = render;
</script>

</body>
</html>
