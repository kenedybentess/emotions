<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema Bentes Industrial</title>

<script src="https://cdn.jsdelivr.net/npm/qz-tray/qz-tray.js"></script>

<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:20px}
input,select,button{padding:10px;margin:5px;border-radius:8px;border:none}
button{background:#22c55e;font-weight:bold;cursor:pointer}
.hidden{display:none}
</style>
</head>

<body>

<h1>🏭 Sistema Bentes Industrial</h1>

<div id="login" class="card">
<h3>Login</h3>
<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">
<button onclick="logar()">Entrar</button>
</div>

<div id="sistema" class="hidden">

<div class="card">
<h3>Cadastro Produto</h3>
<input id="codProd" placeholder="Código">
<input id="nomeProd" placeholder="Nome">
<button onclick="salvarProduto()">Salvar</button>
</div>

<div class="card">
<h3>Produção</h3>

<input id="codigo" placeholder="Código">
<input id="ordem" placeholder="Ordem">
<input id="qtd" type="number" placeholder="Quantidade">

<select id="maquina">
<option>Injetora 01</option>
<option>Injetora 02</option>
</select>

<select id="turno">
<option>Manhã</option>
<option>Tarde</option>
<option>Noite</option>
</select>

<input id="cavidade" placeholder="Cavidade">

<button onclick="registrar()">Registrar</button>
<button onclick="imprimir()">Imprimir</button>

</div>

<div class="card">
<h3>Histórico</h3>
<ul id="lista"></ul>
</div>

</div>

<script>

let usuarioLogado = "";

function logar(){
    if(user.value && pass.value){
        usuarioLogado = user.value;
        login.classList.add("hidden");
        sistema.classList.remove("hidden");
    }
}

function salvarProduto(){
    let produtos = JSON.parse(localStorage.getItem("produtos")||"{}");
    produtos[codProd.value] = nomeProd.value;
    localStorage.setItem("produtos", JSON.stringify(produtos));
    alert("Produto salvo");
}

function registrar(){

    let produtos = JSON.parse(localStorage.getItem("produtos")||"{}");

    let item = {
        codigo: codigo.value,
        nome: produtos[codigo.value] || "SEM CADASTRO",
        ordem: ordem.value,
        qtd: qtd.value,
        maquina: maquina.value,
        turno: turno.value,
        cavidade: cavidade.value,
        operador: usuarioLogado,
        data: new Date().toLocaleString()
    };

    let dados = JSON.parse(localStorage.getItem("dados")||"[]");
    dados.push(item);
    localStorage.setItem("dados", JSON.stringify(dados));

    render();
}

function render(){
    let dados = JSON.parse(localStorage.getItem("dados")||"[]");
    lista.innerHTML="";
    dados.reverse().forEach(d=>{
        let li=document.createElement("li");
        li.innerHTML = d.codigo+" | "+d.nome+" | "+d.qtd+" | "+d.operador;
        lista.appendChild(li);
    });
}

async function imprimir(){

    try{

        await qz.websocket.connect();

        const config = qz.configs.create("SNBC BTP-7400BPLE");

        let codigo = document.getElementById("codigo").value;
        let ordem = document.getElementById("ordem").value;
        let qtd = document.getElementById("qtd").value;

        let data = new Date().toLocaleString();

        let printData = [
            '\x1B\x40',
            'BENTES INDUSTRIAL\n',
            'CONTROLE SEMI ACABADO\n',
            '--------------------------\n',
            'OP: '+ordem+'\n',
            'QTD: '+qtd+'\n',
            data+'\n',
            '--------------------------\n',
            'PRODUTO: '+codigo+'\n',
            '\n'+codigo+'\n\n\n',
            '\x1D\x56\x00'
        ];

        await qz.print(config, printData);

        qz.websocket.disconnect();

    }catch(e){
        alert("Erro: "+e);
    }
}

render();

</script>

</body>
</html>
