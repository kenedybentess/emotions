<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pro - Sistema de Gestão</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --warning-color: #f1c40f;
            --light-bg: #f4f7f6;
            --text-color: #333;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--light-bg); display: flex; }
        
        /* Sidebar */
        .sidebar { width: 250px; height: 100vh; background-color: var(--primary-color); color: white; position: fixed; }
        .sidebar h2 { text-align: center; color: var(--secondary-color); margin-top: 20px; }
        .sidebar nav a { display: block; color: white; padding: 15px 25px; text-decoration: none; transition: 0.3s; }
        .sidebar nav a:hover { background-color: var(--secondary-color); }

        /* Main Content */
        .main-content { margin-left: 250px; padding: 30px; width: calc(100% - 250px); }
        header { display: flex; justify-content: space-between; background: white; padding: 15px 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Dash Cards */
        .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card .value { font-size: 1.8rem; font-weight: bold; margin-top: 10px; }

        /* Chart Section */
        .charts-container { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; max-height: 300px; }

        /* Table & Search */
        .table-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-bar { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .btn-add { background: var(--success-color); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; }
        table th, table td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .status-pill { padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; color: white; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; width: 400px; margin: 10% auto; padding: 20px; border-radius: 8px; }
        .modal-content input, .modal-content select { width: 90%; padding: 10px; margin: 10px 0; }
        
        @media (max-width: 768px) { .sidebar { width: 70px; } .sidebar span { display: none; } .main-content { margin-left: 70px; width: 100%; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>E-Pro</h2>
        <nav>
            <a href="#">🏠 <span>Dashboard</span></a>
            <a href="#">📦 <span>Produtos</span></a>
        </nav>
    </div>

    <div class="main-content">
        <header>
            <h1>Painel de Injeção</h1>
            <div class="user-info"><strong>Admin</strong></div>
        </header>

        <div class="dashboard-cards">
            <div class="card"><h3>Itens Totais</h3><div class="value" id="total-items">0</div></div>
            <div class="card" style="border-top: 5px solid var(--danger-color)"><h3>Crítico</h3><div class="value" id="critico-count">0</div></div>
            <div class="card">
                <canvas id="myChart" style="max-height: 100px;"></canvas>
            </div>
        </div>

        <div class="table-container">
            <div class="controls">
                <input type="text" id="search" class="search-bar" placeholder="Pesquisar produto...">
                <button class="btn-add" onclick="toggleModal()">+ Novo Produto</button>
            </div>
            <table id="productTable">
                <thead>
                    <tr>
                        <th>Cód.</th>
                        <th>Descrição</th>
                        <th>Qtd.</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="inventory-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Cadastro -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>Novo Item de Injeção</h3>
            <input type="text" id="p-code" placeholder="Código (ex: #INJ-001)">
            <input type="text" id="p-desc" placeholder="Descrição">
            <input type="number" id="p-qty" placeholder="Quantidade em estoque">
            <button class="btn-add" onclick="addProduct()">Salvar</button>
            <button onclick="toggleModal()" style="background:none; border:none; color:red; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <script>
        // 4. PERSISTÊNCIA (Local Storage)
        let inventory = JSON.parse(localStorage.getItem('estoque_data')) || [
            { code: '#INJ-001', desc: 'Molde Plástico A1', qty: 50 },
            { code: '#INJ-042', desc: 'Resina Termoplástica', qty: 5 }
        ];

        function toggleModal() {
            const modal = document.getElementById('modal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        // 1 & 2. CADASTRO E LÓGICA DE STATUS
        function addProduct() {
            const code = document.getElementById('p-code').value;
            const desc = document.getElementById('p-desc').value;
            const qty = parseInt(document.getElementById('p-qty').value);

            if(code && desc && !isNaN(qty)) {
                inventory.push({ code, desc, qty });
                updateUI();
                toggleModal();
                // Limpar campos
                document.getElementById('p-code').value = '';
                document.getElementById('p-desc').value = '';
                document.getElementById('p-qty').value = '';
            }
        }

        function deleteProduct(index) {
            inventory.splice(index, 1);
            updateUI();
        }

        function updateUI() {
            const tbody = document.getElementById('inventory-body');
            tbody.innerHTML = '';
            let critico = 0;

            inventory.forEach((item, index) => {
                // LÓGICA DE STATUS
                let statusText = 'OK';
                let statusClass = 'var(--success-color)';
                if (item.qty < 10) {
                    statusText = 'CRÍTICO';
                    statusClass = 'var(--danger-color)';
                    critico++;
                } else if (item.qty < 20) {
                    statusText = 'ALERTA';
                    statusClass = 'var(--warning-color)';
                }

                tbody.innerHTML += `
                    <tr>
                        <td>${item.code}</td>
                        <td>${item.desc}</td>
                        <td>${item.qty}</td>
                        <td><span class="status-pill" style="background:${statusClass}">${statusText}</span></td>
                        <td><button onclick="deleteProduct(${index})" style="background:var(--danger-color); font-size:10px">Remover</button></td>
                    </tr>
                `;
            });

            document.getElementById('total-items').innerText = inventory.length;
            document.getElementById('critico-count').innerText = critico;
            
            localStorage.setItem('estoque_data', JSON.stringify(inventory));
            updateChart();
        }

        // 3. GRÁFICO (Chart.js)
        let myChart;
        function updateChart() {
            const ctx = document.getElementById('myChart').getContext('2d');
            if(myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['OK', 'Crítico'],
                    datasets: [{
                        data: [inventory.filter(i => i.qty >= 10).length, inventory.filter(i => i.qty < 10).length],
                        backgroundColor: ['#27ae60', '#e74c3c']
                    }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        }

        // BUSCA EM TEMPO REAL
        document.getElementById('search').addEventListener('keyup', function(e) {
            const term = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#inventory-body tr');
            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(term) ? '' : 'none';
            });
        });

        // Inicializar
        updateUI();
    </script>
</body>
</html>
