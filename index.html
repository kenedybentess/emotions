<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pro - Histórico Completo</title>
    <style>
        :root {
            --primary: #2c3e50;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #f4f7f6;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light); display: flex; }
        .sidebar { width: 220px; height: 100vh; background: var(--primary); color: white; position: fixed; padding: 20px; }
        .main-content { margin-left: 260px; padding: 30px; width: calc(100% - 260px); }
        
        .section-title { border-left: 5px solid var(--primary); padding-left: 15px; margin: 30px 0 15px 0; color: var(--primary); }
        
        section { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-size: 0.85rem; text-transform: uppercase; color: #666; }

        /* Estilos do Histórico */
        .tipo-entrada { color: var(--success); font-weight: bold; }
        .tipo-saida { color: var(--danger); font-weight: bold; }
        .data-log { color: #888; font-size: 0.85rem; }
        
        .badge-in { background: #e8f5e9; color: var(--success); padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; }
        .badge-out { background: #ffebee; color: var(--danger); padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; }

        .btn-clear { background: #95a5a6; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; float: right; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>E-PRO</h2>
        <p>Histórico de Fluxo</p>
    </aside>

    <main class="main-content">
        <h1>Movimentações de Materiais</h1>

        <!-- TABELA DE ESTOQUE ATUAL (RESUMIDA) -->
        <h3 class="section-title">Resumo de Inventário</h3>
        <section>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Saldo Atual</th>
                    </tr>
                </thead>
                <tbody id="estoqueResumo"></tbody>
            </table>
        </section>

        <!-- TABELA DE HISTÓRICO DETALHADO -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 class="section-title">Registro de Entradas e Saídas</h3>
            <button class="btn-clear" onclick="limparHistorico()">Limpar Histórico</button>
        </div>
        
        <section>
            <table>
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Operação</th>
                        <th>Produto</th>
                        <th>Qtd Movimentada</th>
                        <th>Saldo Pós-Ação</th>
                    </tr>
                </thead>
                <tbody id="historicoCorpo">
                    <!-- Logs aparecerão aqui -->
                </tbody>
            </table>
        </section>
    </main>

    <script>
        // Recupera dados do sistema anterior
        let db = JSON.parse(localStorage.getItem('injecao_db')) || [];
        let historico = JSON.parse(localStorage.getItem('injecao_historico')) || [];

        function renderizarTabelas() {
            // 1. Renderiza Resumo do Estoque
            const resumo = document.getElementById('estoqueResumo');
            resumo.innerHTML = '';
            db.forEach(item => {
                resumo.innerHTML += `
                    <tr>
                        <td><strong>${item.codigo}</strong></td>
                        <td>${item.desc}</td>
                        <td>${item.qtd}</td>
                    </tr>
                `;
            });

            // 2. Renderiza Histórico (do mais recente para o mais antigo)
            const corpoH = document.getElementById('historicoCorpo');
            corpoH.innerHTML = '';

            if (historico.length === 0) {
                corpoH.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#999;">Nenhuma movimentação registrada.</td></tr>';
            }

            historico.forEach(log => {
                const classeTipo = log.tipo === 'ENTRADA' ? 'tipo-entrada' : 'tipo-saida';
                const badge = log.tipo === 'ENTRADA' ? 'badge-in' : 'badge-out';
                const sinal = log.tipo === 'ENTRADA' ? '+' : '-';

                corpoH.innerHTML += `
                    <tr>
                        <td class="data-log">${log.data}</td>
                        <td><span class="${badge}">${log.tipo}</span></td>
                        <td><strong>${log.produto}</strong></td>
                        <td class="${classeTipo}">${sinal} ${log.qtdMov}</td>
                        <td style="color:#2c3e50; font-weight:500;">${log.saldoFinal}</td>
                    </tr>
                `;
            });
        }

        function limparHistorico() {
            if(confirm("Deseja apagar todo o histórico de movimentações? (Isso não altera o estoque atual)")) {
                historico = [];
                localStorage.setItem('injecao_historico', JSON.stringify(historico));
                renderizarTabelas();
            }
        }

        // Executa ao abrir a página
        renderizarTabelas();

        // Nota: Para que este histórico funcione com seus botões de Entrada/Saída anteriores,
        // você deve adicionar esta lógica dentro da função movimentar() do seu código principal:
        /*
        historico.unshift({
            data: new Date().toLocaleString('pt-BR'),
            tipo: tipo, // 'ENTRADA' ou 'SAIDA'
            produto: db[idx].codigo + " - " + db[idx].desc,
            qtdMov: qtd,
            saldoFinal: db[idx].qtd
        });
        localStorage.setItem('injecao_historico', JSON.stringify(historico));
        */
    </script>
</body>
</html>
