<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema Bentes Industrial</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:#fff;
    padding:20px;
}
h1{margin-bottom:20px}

input,select,button{
    padding:10px;
    margin:5px;
    border-radius:8px;
    border:none;
}

button{
    background:#22c55e;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

ul{list-style:none;padding:0}
li{
    background:#334155;
    margin:5px 0;
    padding:10px;
    border-radius:8px;
}
</style>
</head>

<body>

<h1>🏭 Sistema Bentes Industrial</h1>

<div class="card">
<h3>Produção</h3>

<input id="codigo" placeholder="Código do Produto">
<input id="ordem" placeholder="Ordem de Produção">
<input id="qtd" type="number" placeholder="Quantidade">

<br>

<select id="maquina">
<option>Injetora 01</option>
<option>Injetora 02</option>
<option>Injetora 03</option>
</select>

<select id="turno">
<option>Manhã</option>
<option>Tarde</option>
<option>Noite</option>
</select>

<input id="cavidade" placeholder="Cavidade">

<br>

<button onclick="registrar()">Registrar Produção</button>

</div>

<div class="card">
<h3>Histórico</h3>
<ul id="lista"></ul>
</div>

<script>
function registrar(){

    let item = {
        codigo: document.getElementById("codigo").value,
        ordem: document.getElementById("ordem").value,
        qtd: document.getElementById("qtd").value,
        maquina: document.getElementById("maquina").value,
        turno: document.getElementById("turno").value,
        cavidade: document.getElementById("cavidade").value,
        data: new Date().toLocaleString()
    };

    let dados = JSON.parse(localStorage.getItem("dados") || "[]");
    dados.push(item);
    localStorage.setItem("dados", JSON.stringify(dados));

    limpar();
    render();
}

function limpar(){
    document.getElementById("codigo").value = "";
    document.getElementById("ordem").value = "";
    document.getElementById("qtd").value = "";
    document.getElementById("cavidade").value = "";
}

function render(){

    let dados = JSON.parse(localStorage.getItem("dados") || "[]");

    let lista = document.getElementById("lista");
    lista.innerHTML = "";

    dados.reverse().forEach(d => {

        let li = document.createElement("li");

        li.innerHTML = `
        <b>${d.codigo}</b> | QTD: ${d.qtd}<br>
        Ordem: ${d.ordem}<br>
        Máquina: ${d.maquina} | Turno: ${d.turno}<br>
        Cavidade: ${d.cavidade}<br>
        Data: ${d.data}
        `;

        lista.appendChild(li);
    });
}

render();
</script>

</body>
</html>
