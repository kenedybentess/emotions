<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pro - Registro de Fluxo</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --light: #f8f9fa;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: var(--light); }
        .sidebar { width: 240px; height: 100vh; background: var(--primary); color: white; position: fixed; }
        .main-content { margin-left: 240px; padding: 30px; width: calc(100% - 240px); }
        
        .card-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .btn { padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-in { background: var(--success); }
        .btn-out { background: var(--danger); }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f1f1f1; color: var(--primary); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; }
        .modal-content { background: white; width: 450px; margin: 80px auto; padding: 30px; border-radius: 12px; }
        .modal-content h3 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        .log-entrada { color: var(--success); font-weight: bold; }
        .log-saida { color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="text-align:center">E-PRO</h2>
        <nav style="padding: 20px;">
            <p>SISTEMA DE FLUXO</p>
        </nav>
    </aside>

    <main class="main-content">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h1>Controle de Movimentação</h1>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-in" onclick="openModal('modalEntrada')">➕ Registrar Entrada</button>
                <button class="btn btn-out" onclick="openModal('modalSaida')">➖ Registrar Saída</button>
            </div>
        </header>

        <div class="card-container">
            <div class="card">
                <h3>Estoque Atual</h3>
                <table id="estoqueTable">
                    <thead>
                        <tr><th>Produto</th><th>Qtd</th></tr>
                    </thead>
                    <tbody id="estoqueBody"></tbody>
                </table>
            </div>
            <div class="card">
                <h3>Últimas Atividades</h3>
                <table id="historyTable">
                    <thead>
                        <tr><th>Data</th><th>Tipo</th><th>Produto</th><th>Qtd</th></tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL ENTRADA -->
    <div id="modalEntrada" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--success)">Registrar Entrada de Material</h3>
            <label>Selecione o Produto:</label>
            <select id="in-select"></select>
            <label>Quantidade a Adicionar:</label>
            <input type="number" id="in-qty" min="1">
            <button class="btn btn-in" style="width:100%" onclick="processarFluxo('ENTRADA')">Confirmar Entrada</button>
            <button onclick="closeModal('modalEntrada')" style="width:100%; margin-top:10px; background:none; border:none; cursor:pointer">Cancelar</button>
        </div>
    </div>

    <!-- MODAL SAÍDA -->
    <div id="modalSaida" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--danger)">Registrar Saída (Produção)</h3>
            <label>Selecione o Produto:</label>
            <select id="out-select"></select>
            <label>Quantidade a Retirar:</label>
            <input type="number" id="out-qty" min="1">
            <button class="btn btn-out" style="width:100%" onclick="processarFluxo('SAIDA')">Confirmar Saída</button>
            <button onclick="closeModal('modalSaida')" style="width:100%; margin-top:10px; background:none; border:none; cursor:pointer">Cancelar</button>
        </div>
    </div>

    <script>
        // Simulando banco de dados que será Cloud no futuro
        let estoque = JSON.parse(localStorage.getItem('db_estoque')) || [
            { id: 1, nome: 'Resina PP Azul', qtd: 100 },
            { id: 2, nome: 'Pino Extrator 8mm', qtd: 50 },
            { id: 3, nome: 'Molde Carcaça G', qtd: 5 }
        ];

        let historico = JSON.parse(localStorage.getItem('db_historico')) || [];

        function openModal(id) {
            populateSelects();
            document.getElementById(id).style.display = 'block';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function populateSelects() {
            const inSelect = document.getElementById('in-select');
            const outSelect = document.getElementById('out-select');
            inSelect.innerHTML = outSelect.innerHTML = '';
            
            estoque.forEach(item => {
                let opt = `<option value="${item.id}">${item.nome} (Atual: ${item.qtd})</option>`;
                inSelect.innerHTML += opt;
                outSelect.innerHTML += opt;
            });
        }

        function processarFluxo(tipo) {
            const prefix = tipo === 'ENTRADA' ? 'in' : 'out';
            const idProd = parseInt(document.getElementById(`${prefix}-select`).value);
            const qtdAlt = parseInt(document.getElementById(`${prefix}-qty`).value);

            if (isNaN(qtdAlt) || qtdAlt <= 0) return alert("Insira uma quantidade válida!");

            const produto = estoque.find(p => p.id === idProd);

            if (tipo === 'SAIDA' && produto.qtd < qtdAlt) {
                return alert("Estoque insuficiente para esta saída!");
            }

            // Atualiza Estoque
            produto.qtd = tipo === 'ENTRADA' ? produto.qtd + qtdAlt : produto.qtd - qtdAlt;

            // Registra Histórico
            historico.unshift({
                data: new Date().toLocaleString(),
                tipo: tipo,
                produto: produto.nome,
                qtd: qtdAlt
            });

            saveAndRender();
            closeModal(`modal${tipo.charAt(0) + tipo.slice(1).toLowerCase()}`);
        }

        function saveAndRender() {
            localStorage.setItem('db_estoque', JSON.stringify(estoque));
            localStorage.setItem('db_historico', JSON.stringify(historico));
            
            // Renderiza Estoque
            const eBody = document.getElementById('estoqueBody');
            eBody.innerHTML = '';
            estoque.forEach(p => {
                eBody.innerHTML += `<tr><td>${p.nome}</td><td><strong>${p.qtd}</strong></td></tr>`;
            });

            // Renderiza Histórico
            const hBody = document.getElementById('historyBody');
            hBody.innerHTML = '';
            historico.slice(0, 10).forEach(h => {
                const classe = h.tipo === 'ENTRADA' ? 'log-entrada' : 'log-saida';
                hBody.innerHTML += `<tr>
                    <td>${h.data}</td>
                    <td class="${classe}">${h.tipo}</td>
                    <td>${h.produto}</td>
                    <td>${h.qtd}</td>
                </tr>`;
            });
        }

        saveAndRender();
    </script>
</body>
</html>
